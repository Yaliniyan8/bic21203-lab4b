<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 4b - Question 2</title>
</head>
<body>
  <h1>Book Collection</h1>
  <div id="output" role="region" aria-live="polite"></div>

  <script>
    async function loadBooks() {
      const outputDiv = document.getElementById("output");

      try {
        const response = await fetch("books.json");

        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const data = await response.json();

       
        const firstTitle = document.createElement("p");
        firstTitle.textContent = `First Book Title: ${data.books[0].title}`;
        outputDiv.appendChild(firstTitle);

        
        const secondAuthor = document.createElement("p");
        secondAuthor.textContent = `Second Book Author: ${data.books[1].author}`;
        outputDiv.appendChild(secondAuthor);

       
        const genresHeading = document.createElement("h2");
        genresHeading.textContent = "Genres by Book";
        outputDiv.appendChild(genresHeading);

        const genreList = document.createElement("ul");
        data.books.forEach((book) => {
          const listItem = document.createElement("li");
          listItem.textContent = `${book.title} — ${book.genres.join(", ")}`;
          genreList.appendChild(listItem);
        });

        outputDiv.appendChild(genreList);
      } catch (error) {
        console.error("Error loading JSON:", error);
        const errorMessage = document.createElement("p");
        errorMessage.style.color = "red";
        errorMessage.textContent =
          "Unable to load book data. Please ensure books.json exists, contains valid JSON, and is opened via a local server.";
        outputDiv.appendChild(errorMessage);
      }
    }

    loadBooks();
  </script>
</body>
</html>
